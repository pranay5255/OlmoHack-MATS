[project]
name = "olmohack-mats"
version = "0.1.0"
description = "OLMo 3 agent rollout experiments for the MATS application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "harbor[modal]==0.21.0",
  "modal==1.5.4",
]

[tool.uv]
package = false
default-groups = ["dev", "analysis", "notebooks"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]
analysis = [
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
]
notebooks = [
  "ipykernel>=6,<8",
]
